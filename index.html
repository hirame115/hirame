<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>砂時計タイマー</title>
    <!-- Tailwind CSSを読み込み --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js (音源ライブラリ) を読み込み --><script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        /* 画面全体を中央揃えにするためのスタイル */
        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap; /* 画面が狭い場合は折り返す */
            gap: 2rem; /* カード間の隙間 */
            padding: 2rem; /* 画面端の余白 */
            background-color: #f0f2f5; /* 少し明るい背景色 */
        }
        /* 砂が落ちるアニメーション（点線が流れるように見せる） */
        @keyframes stream-animation {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 10px;
            }
        }
        /* 砂の流れのスタイル */
        #sand-stream {
            /* JSで色を制御するため background-image を削除 */
            background-size: 2px 10px;
            display: none; /* 初期状態では非表示 */
        }
        #sand-stream.streaming {
            display: block;
            animation: stream-animation 0.1s infinite linear;
        }
        
        /* アナログ時計の針のスタイル */
        .hand {
            position: absolute;
            bottom: 50%; /* 針の根本を中央に */
            left: 50%;
            transform-origin: bottom; /* 根本を軸に回転 */
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- 砂時計カード -->
    <div id="main-card" class="flex flex-col items-center p-8 bg-white shadow-2xl rounded-2xl w-full max-w-sm" title="ダブルクリックでモード切替" style="height: 520px;">
        
        <!-- モード選択エリア -->
        <div id="mode-selector" class="relative mb-4 z-10 min-h-[40px] flex items-center justify-center">
            <button id="current-mode-btn" class="px-4 py-2 text-xl font-bold text-gray-700 transition-colors duration-200 rounded-lg hover:bg-gray-100">
                Focus
            </button>
            <div id="mode-dropdown" class="absolute left-1/2 -translate-x-1/2 top-full mt-2 bg-white shadow-lg rounded-lg p-2 hidden w-48 z-20">
                <button class="mode-option w-full text-left px-4 py-2 rounded hover:bg-gray-100" data-mode="focus">Focus (25m)</button>
                <button class="mode-option w-full text-left px-4 py-2 rounded hover:bg-gray-100" data-mode="break">Break (5m)</button>
                <button class="mode-option w-full text-left px-4 py-2 rounded hover:bg-gray-100" data-mode="longBreak">Long Break (30m)</button>
                <hr class="my-2 border-gray-100">
                <button id="start-session-btn" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 text-blue-600 font-semibold">
                    Start Session
                </button>
            </div>
        </div>

        <!-- 砂時計コンテナ (高さを h-64 に固定し、中身を中央揃え) -->
        <div id="hourglass-container" class="h-64 flex items-center justify-center mb-8 transition-transform duration-1000 ease-in-out cursor-pointer">
            <div class="relative w-32 h-48 border-8 border-gray-700 rounded-[60px]">
                <div id="top-chamber" class="absolute top-0 w-full h-1/2 overflow-hidden rounded-t-[52px]">
                    <div id="sand-top" class="w-full h-full transition-all duration-100" style="border-bottom-left-radius: 52px; border-bottom-right-radius: 52px;"></div>
                </div>
                <div id="bottom-chamber" class="absolute bottom-0 w-full h-1/2 overflow-hidden rounded-b-[52px]">
                    <div id="sand-bottom" class="absolute bottom-0 w-full h-0 transition-all duration-100" style="border-top-left-radius: 52px; border-top-right-radius: 52px;"></div>
                </div>
                <div id="sand-stream" class="absolute top-1/2 left-1/2 w-0.5 h-0 -translate-x-1/2 -translate-y-1/2 transition-all duration-300"></div>
            </div>
        </div>

        <!-- デジタルタイマー表示エリア -->
        <div id="digital-timer" class="mt-8 text-5xl font-semibold text-gray-800 tabular-nums">
            25:00
        </div>
        
        <!-- セッション表示 -->
        <div id="session-display" class="mt-2 text-lg text-gray-600">
            Focus: 1 / 4
        </div>
    </div>

    <!-- アナログ時計カード -->
    <div id="analog-clock-card" class="flex flex-col items-center p-8 bg-white shadow-2xl rounded-2xl w-full max-w-sm cursor-pointer" style="height: 520px;" title="ダブルクリックで履歴表示">
        
        <!-- 日時表示エリア -->
        <div id="current-datetime" class="text-xl font-semibold text-gray-700 mb-4 text-center min-h-[40px] flex items-center justify-center">
            <!-- JSでここに日時が挿入されます -->
        </div>
        
        <!-- 時計の文字盤 (高さを h-64 に) -->
        <div id="clock-face" class="relative w-64 h-64 bg-gray-100 rounded-full border-8 border-gray-700 mb-8">
            <span class="absolute top-4 left-1/2 -translate-x-1/2 text-2xl font-bold text-gray-800">12</span>
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-gray-800">3</span>
            <span class="absolute bottom-4 left-1/2 -translate-x-1/2 text-2xl font-bold text-gray-800">6</span>
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-gray-800">9</span>
            <div id="minute-hand" class="hand w-1.5 h-28 bg-gray-700 rounded-t-full" style="transform: translateX(- ৫০%) rotate(0deg);"></div>
            <div id="hour-hand" class="hand w-2.5 h-20 bg-gray-900 rounded-t-full" style="transform: translateX(-50%) rotate(0deg);"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-gray-900 rounded-full z-20"></div>
        </div>
        
        <!-- デジタル時計（アナログ時計の下） -->
        <div id="analog-digital-time" class="mt-8 text-5xl font-semibold text-gray-800 tabular-nums">
            <!-- JSでここにHH:MMが挿入されます -->
        </div>

        <!-- 休憩ヒント表示エリア (スペーサー) -->
        <div class="mt-2 text-lg">&nbsp;</div>
    </div>

    <!-- 履歴表示モーダル -->
    <div id="history-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">今日の頑張り</h2>
            <div class="text-green-500 mb-6">
                <p id="history-session-count" class="text-5xl font-semibold">合計 0 セッション</p>
                <p id="history-total-time" class="text-2xl text-gray-600">(0 分)</p>
            </div>
            <p id="history-message" class="text-gray-500 mb-8">Focusモードを完了すると、ここに記録されます。</p>
            
            <!-- ボタンコンテナ -->
            <div class="flex flex-col space-y-3">
                <button id="export-csv-btn" class="w-full px-6 py-3 font-semibold text-white bg-green-600 rounded-lg shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-colors">
                    CSVエクスポート
                </button>
                <button id="close-history-modal" class="w-full px-6 py-3 font-semibold text-white bg-blue-500 rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition-colors">
                    閉じる
                </button>
            </div>
        </div>
    </div>


    <script type="module">
        // === Firebase SDKのインポート ===
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            where, 
            getDocs, 
            Timestamp, 
            serverTimestamp,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // === DOM要素の取得 ===
        const hourglassContainer = document.getElementById('hourglass-container');
        const sandTop = document.getElementById('sand-top');
        const sandBottom = document.getElementById('sand-bottom');
        const sandStream = document.getElementById('sand-stream');
        const digitalTimer = document.getElementById('digital-timer');
        const modeSelector = document.getElementById('mode-selector');
        const currentModeBtn = document.getElementById('current-mode-btn');
        const modeDropdown = document.getElementById('mode-dropdown');
        const modeOptions = document.querySelectorAll('.mode-option');
        const sessionDisplay = document.getElementById('session-display');
        const startSessionBtn = document.getElementById('start-session-btn');
        const mainCard = document.getElementById('main-card');
        const analogClockCard = document.getElementById('analog-clock-card');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const currentDatetime = document.getElementById('current-datetime');
        const analogDigitalTime = document.getElementById('analog-digital-time');
        const historyModal = document.getElementById('history-modal');
        const closeHistoryModal = document.getElementById('close-history-modal');
        const exportCsvBtn = document.getElementById('export-csv-btn'); // ★ CSVボタン取得
        const historySessionCount = document.getElementById('history-session-count');
        const historyTotalTime = document.getElementById('history-total-time');
        const historyMessage = document.getElementById('history-message');
        
        const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
        
        // === Firebaseの初期化 ===
        let app, db, auth;
        let userId = null; // ユーザーID
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-pomodoro-app';
        let historyCollectionPath = '';

        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            setLogLevel('debug'); // Firestoreのデバッグログを有効化

            // 認証状態の監視
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    console.log("Authenticated User ID:", user.uid);
                    userId = user.uid;
                    historyCollectionPath = `artifacts/${appId}/users/${userId}/pomodoroHistory`;
                } else {
                    // 認証トークンでサインインを試みる
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            console.log("Signed in with custom token.");
                        } catch (error) {
                            console.error("Error signing in with custom token, falling back to anonymous:", error);
                            await signInAnonymously(auth);
                        }
                    } else {
                        // 匿名認証
                        await signInAnonymously(auth);
                        console.log("Signed in anonymously.");
                    }
                }
            });

        } catch (e) {
            console.error("Firebase initialization error:", e);
        }

        // === 効果音の準備 ===
        const synth = new Tone.Synth().toDestination();
        const endSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        let audioStarted = false;

        async function startAudio() {
            if (!audioStarted) {
                await Tone.start();
                console.log('AudioContext started');
                audioStarted = true;
            }
        }

        // === タイマー設定 ===
        const MODES = {
            focus: { 
                time: 1500000, // 25分
                colorClass: 'bg-green-500', 
                colorHex: '#22c55e', 
                label: 'Focus' 
            },
            break: { 
                time: 300000,   // 5分
                colorClass: 'bg-pink-500', 
                colorHex: '#ec4899', 
                label: 'Break' 
            },
            longBreak: { 
                time: 1800000, // 30分
                colorClass: 'bg-blue-500', 
                colorHex: '#3b82f6', 
                label: 'Long Break' 
            }
        };
        const INTERVAL = 50; // 更新間隔

        // === 状態変数 ===
        let timerId = null;
        let elapsedTime = 0;
        let isRunning = false;
        let currentRotation = 0;
        let clickTimer = null;
        let currentMode = 'focus'; 
        const colorClasses = ['bg-green-500', 'bg-pink-500', 'bg-blue-500'];
        let sessionCount = 0; // セッションカウント (0-7)
        const modesForDoubleClick = ['focus', 'break', 'longBreak'];

        // === 関数定義 ===

        function updateAnalogClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = daysOfWeek[now.getDay()];
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const formattedHours = String(hours).padStart(2, '0');
            const formattedMinutes = String(minutes).padStart(2, '0');
            const datetimeString = `${year}年${month}月${date}日 (${day})`;
            
            if (currentDatetime) currentDatetime.textContent = datetimeString;
            if (analogDigitalTime) analogDigitalTime.textContent = `${formattedHours}:${formattedMinutes}`;

            const hourDeg = (hours % 12) * 30 + minutes * 0.5;
            const minuteDeg = minutes * 6;

            if(hourHand && minuteHand) {
                hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
                minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            }
        }

        function formatTime(ms) {
            const remainingMs = Math.max(0, ms);
            const totalSeconds = Math.ceil(remainingMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateSandColor(colorClass, colorHex) {
            sandTop.classList.remove(...colorClasses);
            sandBottom.classList.remove(...colorClasses);
            sandTop.classList.add(colorClass);
            sandBottom.classList.add(colorClass);
            sandStream.style.backgroundImage = `linear-gradient(transparent 50%, ${colorHex} 50%)`;
        }

        function updateSessionDisplay() {
            if (currentMode === 'focus') {
                const focusNum = Math.floor(sessionCount / 2) + 1;
                sessionDisplay.textContent = `Focus: ${focusNum} / 4`;
            } else if (currentMode === 'break') {
                const focusNum = Math.floor(sessionCount / 2) + 1;
                sessionDisplay.textContent = `Break: ${focusNum} / 4`;
            } else if (currentMode === 'longBreak') {
                sessionDisplay.textContent = `Long Break`;
            }
        }
        
        function resetSession() {
            sessionCount = 0;
            updateSessionDisplay();
        }

        function setMode(newMode, autoStart = false) {
            stopTimer(false); 
            currentMode = newMode;
            elapsedTime = 0;
            
            const modeConfig = MODES[currentMode];
            
            updateSandColor(modeConfig.colorClass, modeConfig.colorHex);
            digitalTimer.textContent = formatTime(modeConfig.time);
            currentModeBtn.textContent = modeConfig.label;
            updateSessionDisplay();
            
            if (newMode === 'focus' && !autoStart) {
                resetSession();
            }

            sandTop.style.transition = 'none'; 
            sandBottom.style.transition = 'none';
            sandTop.style.height = '100%';
            sandBottom.style.height = '0%';
            sandTop.offsetHeight; 
            sandBottom.offsetHeight; 
            setTimeout(() => {
                sandTop.style.transition = 'all 0.1s';
                sandBottom.style.transition = 'all 0.1s';
            }, 50);

            modeDropdown.classList.add('hidden');

            if (autoStart) {
                setTimeout(startTimer, 500); 
            }
        }

        // === 履歴をFirestoreに記録 ===
        async function logFocusSession() {
            if (!db || !userId) {
                console.error("Firestore is not ready. Cannot log session.");
                return;
            }
            try {
                await addDoc(collection(db, historyCollectionPath), {
                    duration: MODES.focus.time / 60000, // 25 (分)
                    timestamp: serverTimestamp() // サーバー時刻
                });
                console.log("Focus session logged to Firestore.");
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        }

        // === 履歴をFirestoreから読み込み ===
        async function showHistory() {
            if (!db || !userId) {
                console.error("Firestore is not ready. Cannot show history.");
                historySessionCount.textContent = "データベース未接続";
                historyTotalTime.textContent = "時間をおいて再度お試しください。";
                historyMessage.classList.add('hidden');
                historyModal.classList.remove('hidden');
                return;
            }

            const startOfDay = new Date();
            startOfDay.setHours(0, 0, 0, 0);
            const endOfDay = new Date();
            endOfDay.setHours(23, 59, 59, 999);

            try {
                const q = query(
                    collection(db, historyCollectionPath),
                    where("timestamp", ">=", Timestamp.fromDate(startOfDay)),
                    where("timestamp", "<=", Timestamp.fromDate(endOfDay))
                );

                const querySnapshot = await getDocs(q);
                let totalMinutes = 0;
                let count = querySnapshot.size;

                querySnapshot.forEach(doc => {
                    totalMinutes += doc.data().duration || 0;
                });

                if (count > 0) {
                    historySessionCount.textContent = `合計 ${count} セッション`;
                    historyTotalTime.textContent = `（${totalMinutes} 分）`;
                    historyMessage.textContent = `今日も一日お疲れ様です！`;
                    historyMessage.classList.remove('hidden');
                } else {
                    historySessionCount.textContent = "まだ記録がありません";
                    historyTotalTime.textContent = "";
                    historyMessage.textContent = "Focusモードを完了して記録しましょう！";
                    historyMessage.classList.remove('hidden');
                }
            } catch (e) {
                console.error("Error getting history: ", e);
                historySessionCount.textContent = "履歴の取得に失敗";
                historyTotalTime.textContent = "エラーが発生しました。";
                historyMessage.classList.add('hidden');
            }
            
            historyModal.classList.remove('hidden');
        }

        // === 履歴をCSVにエクスポート ===
        async function exportHistoryToCSV() {
            if (!db || !userId) {
                console.error("Firestore is not ready. Cannot export history.");
                historyMessage.textContent = "データベース未接続です。";
                return;
            }

            const startOfDay = new Date();
            startOfDay.setHours(0, 0, 0, 0);
            const endOfDay = new Date();
            endOfDay.setHours(23, 59, 59, 999);
            
            const todayStr = startOfDay.getFullYear() + '-' + String(startOfDay.getMonth() + 1).padStart(2, '0') + '-' + String(startOfDay.getDate()).padStart(2, '0');

            let csvString = "Date,Time,Duration (min)\n"; // CSV Header

            try {
                const q = query(
                    collection(db, historyCollectionPath),
                    where("timestamp", ">=", Timestamp.fromDate(startOfDay)),
                    where("timestamp", "<=", Timestamp.fromDate(endOfDay))
                );

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    console.log("No data to export.");
                    historyMessage.textContent = "エクスポートするデータがありません。";
                    return;
                }

                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    const timestamp = data.timestamp ? data.timestamp.toDate() : new Date(); // Convert Firestore Timestamp
                    const duration = data.duration || 0;

                    const date = timestamp.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-');
                    const time = timestamp.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    
                    csvString += `${date},${time},${duration}\n`;
                });

                // Create and download CSV
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]); // BOM for UTF-8 Excel compatibility
                const blob = new Blob([bom, csvString], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);

                link.setAttribute("href", url);
                link.setAttribute("download", `focus_history_${todayStr}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url); // Clean up

            } catch (e) {
                console.error("Error exporting CSV: ", e);
                historyMessage.textContent = "CSVのエクスポートに失敗しました。";
            }
        }


        function updateSand() {
            elapsedTime += INTERVAL;
            let remainingTime = MODES[currentMode].time - elapsedTime;
            let progress = elapsedTime / MODES[currentMode].time;

            if (progress >= 1) {
                progress = 1;
                remainingTime = 0;
                stopTimer(false); 

                startAudio().then(() => {
                    endSynth.voices.forEach(voice => voice.envelope.cancel());
                    endSynth.triggerAttackRelease(["C4", "E4", "G4"], "4n");
                });

                // ★ Focusモード完了時に履歴を記録
                if (currentMode === 'focus') {
                    logFocusSession();
                }

                // セッションロジック
                sessionCount++;
                if (sessionCount === 8) { // Long Break 終了
                    sessionCount = 0; // セッションリセット
                    setMode('focus', true); // Focus 1 へ
                } else if (sessionCount === 7) { 
                    setMode('longBreak', true); // Long Break へ
                } else if (sessionCount % 2 === 1) { // Focus 終了 (1, 3, 5)
                    setMode('break', true); // Break へ
                } else { // Break 終了 (2, 4, 6)
                    setMode('focus', true); // Focus へ
                }
                return; 
            }

            sandTop.style.height = `${(1 - progress) * 100}%`;
            sandBottom.style.height = `${progress * 100}%`;
            digitalTimer.textContent = formatTime(remainingTime);
        }

        function startTimer() {
            if (isRunning) return;
            if (elapsedTime >= MODES[currentMode].time) return;

            startAudio().then(() => {
                synth.envelope.cancel();
                synth.triggerAttackRelease("C5", "8n");
            });

            isRunning = true;
            sandStream.classList.add('streaming');
            sandStream.style.height = '24px';
            timerId = setInterval(updateSand, INTERVAL);
        }

        function stopTimer(playSound = true) {
            if (!isRunning) return;
            if (playSound) {
                startAudio().then(() => {
                    synth.envelope.cancel();
                    synth.triggerAttackRelease("G4", "8n");
                });
            }
            isRunning = false;
            sandStream.style.height = '0';
            setTimeout(() => sandStream.classList.remove('streaming'), 300);
            clearInterval(timerId);
        }

        function resetTimer() {
            startAudio().then(() => {
                synth.envelope.cancel();
                synth.triggerAttackRelease("E5", "16n");
                synth.triggerAttackRelease("C5", "16n", "+0.15");
            });

            stopTimer(false);
            elapsedTime = 0; 
            digitalTimer.textContent = formatTime(MODES[currentMode].time);

            sandTop.style.transition = 'none'; 
            sandBottom.style.transition = 'none';
            sandTop.style.height = '100%';
            sandBottom.style.height = '0%';
            sandTop.offsetHeight; 
            sandBottom.offsetHeight;
            setTimeout(() => {
                sandTop.style.transition = 'all 0.1s';
                sandBottom.style.transition = 'all 0.1s';
            }, 50);
            
            if (currentMode === 'focus') {
                resetSession();
            }
            
            currentRotation += 360;
            hourglassContainer.style.transform = `rotate(${currentRotation}deg)`;
        }

        // === イベントリスナー ===

        hourglassContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            startAudio(); 
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                resetTimer(); // ダブルクリック
            } else {
                clickTimer = setTimeout(() => {
                    if (isRunning) stopTimer(true);
                    else startTimer();
                    clickTimer = null;
                }, 250); // シングルクリック
            }
        });

        hourglassContainer.addEventListener('dblclick', (e) => e.stopPropagation());

        mainCard.addEventListener('dblclick', (e) => {
            e.stopPropagation(); // ★アナログ時計への伝播を防ぐ
            startAudio().then(() => { 
                synth.envelope.cancel();
                synth.triggerAttackRelease("E5", "16n");
                synth.triggerAttackRelease("G5", "16n", "+0.15");
            });
            const currentModeIndex = modesForDoubleClick.indexOf(currentMode);
            const nextModeIndex = (currentModeIndex + 1) % modesForDoubleClick.length;
            setMode(modesForDoubleClick[nextModeIndex]);
        });
        
        // ★ アナログ時計カードのダブルクリックで履歴表示
        analogClockCard.addEventListener('dblclick', () => {
            startAudio();
            showHistory();
        });

        // ★ 履歴モーダルを閉じる
        closeHistoryModal.addEventListener('click', () => {
            historyModal.classList.add('hidden');
        });

        // ★ CSVエクスポートボタン
        exportCsvBtn.addEventListener('click', () => {
            startAudio();
            exportHistoryToCSV();
        });

        currentModeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            startAudio(); 
            modeDropdown.classList.toggle('hidden');
        });

        modeOptions.forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation(); 
                setMode(button.dataset.mode); 
            });
        });

        startSessionBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            startAudio(); 
            resetSession();
            setMode('focus', true);
        });

        document.addEventListener('click', (event) => {
            if (!modeSelector.contains(event.target)) {
                modeDropdown.classList.add('hidden');
            }
        });

        // === 初期化 ===
        setMode('focus');
        updateAnalogClock();
        setInterval(updateAnalogClock, 1000);
    </script>
</body>
</html>
